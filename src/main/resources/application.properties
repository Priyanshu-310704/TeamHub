spring.application.name=teamhub-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/teamhub_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP
spring.datasource.hikari.pool-name=TeamHubHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ==========================================
# SPRING AI CONFIGURATION (GEMINI 2.5 FLASH)
# ==========================================
spring.ai.google.genai.api-key=${GEMINI_API_KEY:your_gemini_api_key_here}
spring.ai.google.genai.chat.options.model=gemini-3.8-flash
spring.ai.google.genai.chat.options.temperature=0.2